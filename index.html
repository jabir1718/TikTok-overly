<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Angel01Cobra Live Overlay</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif;color:white}
body{position:relative}

/* ===== ACTIVITY CORNER ===== */
#activity{
 position:absolute;left:18px;bottom:18px;width:360px;
 display:flex;flex-direction:column;gap:8px;
 pointer-events:none
}
.activity-card{
 display:flex;align-items:center;gap:10px;
 padding:9px 13px;border-radius:24px;
 background:rgba(5,5,15,.76);
 border:1px solid rgba(0,242,254,.55);
 box-shadow:0 0 14px rgba(0,242,254,.35);
 animation:activityIn .55s cubic-bezier(.2,1.4,.4,1);
 backdrop-filter:blur(8px)
}
.activity-card img{
 width:38px;height:38px;border-radius:50%;
 object-fit:cover;border:2px solid #00f2fe
}
.activity-name{font-weight:800;color:#00f2fe;font-size:14px}
.activity-text{font-size:12px;color:#eee;margin-top:2px}

@keyframes activityIn{
 from{opacity:0;transform:translateX(-120%) scale(.7)}
 to{opacity:1;transform:none}
}

/* ===== CENTER ALERT ===== */
#alerts{
 position:absolute;inset:0;
 display:flex;align-items:center;justify-content:center;
 pointer-events:none
}
.alert{
 position:absolute;min-width:330px;max-width:520px;
 padding:18px 22px;border-radius:28px;
 display:flex;align-items:center;gap:14px;
 background:linear-gradient(135deg,rgba(8,8,25,.92),rgba(30,0,45,.86));
 border:2px solid #ff2bd6;
 box-shadow:0 0 18px #ff2bd6,0 0 55px rgba(0,242,254,.35);
 animation:alertIn .7s cubic-bezier(.15,1.5,.3,1)
}
.alert img{
 width:68px;height:68px;border-radius:50%;
 object-fit:cover;border:3px solid #fff;
 box-shadow:0 0 16px #00f2fe
}
.alert .name{font-size:19px;font-weight:900;color:#fff}
.alert .message{font-size:14px;color:#ffe6fa;margin-top:5px}
.alert .gift{font-size:30px;margin-left:auto}
.alert .count{font-size:20px;font-weight:900;color:#fffb00}

@keyframes alertIn{
 0%{opacity:0;transform:scale(.15) rotate(-8deg)}
 65%{transform:scale(1.12) rotate(2deg)}
 100%{opacity:1;transform:scale(1)}
}

/* ===== MYSTERY BOX ===== */
#mystery{
 position:absolute;inset:0;
 display:none;align-items:center;justify-content:center;
 pointer-events:none;z-index:20
}
.mystery-box{
 text-align:center;
 animation:boxIn .8s cubic-bezier(.1,1.6,.3,1)
}
.box{
 width:145px;height:120px;margin:auto;
 border-radius:18px;
 background:linear-gradient(145deg,#ff007f,#7a00ff);
 border:3px solid white;
 box-shadow:0 0 25px #ff007f,0 0 75px #7a00ff;
 display:flex;align-items:center;justify-content:center;
 font-size:65px;
 animation:boxPulse .7s infinite alternate
}
.mystery-title{
 margin-top:15px;font-size:25px;font-weight:900;
 text-shadow:0 0 12px #fff,0 0 30px #ff00cc
}
.mystery-user{margin-top:5px;color:#00f2fe;font-size:16px;font-weight:bold}

@keyframes boxIn{
 from{opacity:0;transform:scale(.1) rotate(-20deg)}
 to{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes boxPulse{
 to{transform:scale(1.08);filter:brightness(1.35)}
}

/* ===== FULL SCREEN EFFECT ===== */
#blast{
 position:absolute;inset:0;
 pointer-events:none;z-index:10;display:none;
 background:
 radial-gradient(circle at center,rgba(255,255,255,.9) 0 2%,
 rgba(255,0,200,.4) 10%,transparent 42%);
 animation:blast .9s ease-out
}
@keyframes blast{
 0%{opacity:0;transform:scale(.2)}
 20%{opacity:1}
 100%{opacity:0;transform:scale(2.3)}
}

/* ===== PARTICLES ===== */
.particle{
 position:absolute;pointer-events:none;
 font-size:20px;z-index:30;
 animation:particleFly 1.5s ease-out forwards
}
@keyframes particleFly{
 from{opacity:1;transform:translate(0,0) scale(1) rotate(0)}
 to{opacity:0;transform:translate(var(--x),var(--y)) scale(.2) rotate(500deg)}
}

/* ===== TOP STATUS ===== */
#status{
 position:absolute;right:18px;top:18px;
 padding:7px 14px;border-radius:20px;
 background:rgba(0,0,0,.65);
 border:1px solid rgba(255,0,127,.65);
 box-shadow:0 0 15px rgba(255,0,127,.35);
 font-size:12px;font-weight:bold;
}
.dot{
 display:inline-block;width:8px;height:8px;
 border-radius:50%;background:#ff3355;
 margin-right:6px;box-shadow:0 0 8px #ff3355
}
</style>
</head>

<body>

<div id="status"><span class="dot"></span>LIVE OVERLAY</div>

<div id="activity"></div>
<div id="alerts"></div>
<div id="mystery">
 <div class="mystery-box">
   <div class="box">🎁</div>
   <div class="mystery-title">MYSTERY WELCOME</div>
   <div class="mystery-user"></div>
 </div>
</div>
<div id="blast"></div>

<script>
/*
  ANGEL01COBRA LIVE OVERLAY
  Visual event system.
  Later server.mjs can call:
  showWelcome(...)
  showFollow(...)
  showLike(...)
  showGift(...)
  showComment(...)
  showShare(...)
*/

/* Change this later from the control panel/server */
const TIKTOK_USERNAME = "new2027music";

const DEFAULT_AVATAR =
 "https://i.pravatar.cc/150?img=12";

const activity = document.getElementById("activity");
const alerts = document.getElementById("alerts");
const mystery = document.getElementById("mystery");
const blast = document.getElementById("blast");

/* ===== COMMON ===== */

function avatar(user){
 return user.avatar || DEFAULT_AVATAR;
}

function makeParticles(big=false){
 const amount = big ? 55 : 22;
 const symbols = ["✨","⭐","💖","💎","🌟","⚡","❤️","🔥","🎉"];

 for(let i=0;i<amount;i++){
   const p=document.createElement("div");
   p.className="particle";
   p.textContent=symbols[Math.floor(Math.random()*symbols.length)];

   p.style.left="50%";
   p.style.top="50%";
   p.style.setProperty("--x",(Math.random()*900-450)+"px");
   p.style.setProperty("--y",(Math.random()*700-350)+"px");

   document.body.appendChild(p);
   setTimeout(()=>p.remove(),1600);
 }
}

function fullBlast(big=false){
 blast.style.display="block";
 blast.style.animation="none";
 void blast.offsetWidth;
 blast.style.animation="blast .9s ease-out";

 makeParticles(big);

 setTimeout(()=>blast.style.display="none",950);
}

function activityAdd(user,text){
 const card=document.createElement("div");
 card.className="activity-card";

 card.innerHTML=`
   <img src="${avatar(user)}">
   <div>
     <div class="activity-name">@${user.name}</div>
     <div class="activity-text">${text}</div>
   </div>
 `;

 activity.prepend(card);

 while(activity.children.length>6)
   activity.lastElementChild.remove();

 setTimeout(()=>{
   card.style.opacity="0";
   card.style.transform="translateX(-120%)";
   card.style.transition=".5s";
   setTimeout(()=>card.remove(),500);
 },10000);
}

/* ===== MAIN ALERT ===== */

function showAlert(user,message,emoji="❤️",count=""){
 const card=document.createElement("div");
 card.className="alert";

 card.innerHTML=`
   <img src="${avatar(user)}">
   <div>
     <div class="name">@${user.name}</div>
     <div class="message">${message}</div>
   </div>
   <div class="gift">${emoji}</div>
   ${count ? `<div class="count">x${count}</div>` : ""}
 `;

 alerts.appendChild(card);

 setTimeout(()=>{
   card.style.transition="opacity .5s,transform .5s";
   card.style.opacity="0";
   card.style.transform="scale(.7)";
   setTimeout(()=>card.remove(),500);
 },6500);
}

/* ===== WELCOME ===== */

function showWelcome(user){
 showAlert(user,"Welcome to the LIVE! 👋","✨");
 activityAdd(user,"Welcome! Thanks for joining ❤️");
 makeParticles(false);
}

/* ===== FOLLOW ===== */

function showFollow(user){
 showAlert(user,"Thanks for following! ❤️","❤️");
 activityAdd(user,"Thanks for following! ❤️");
 makeParticles(false);
}

/* ===== LIKE / TAP ===== */

function showLike(user,amount=1){
 activityAdd(user,`Thanks for the love! ❤️ ${amount>1 ? "×"+amount : ""}`);
}

/* ===== COMMENT ===== */

function showComment(user,comment){
 showAlert(user,comment,"💬");
 activityAdd(user,comment);
}

/* ===== SHARE ===== */

function showShare(user){
 showAlert(user,"Thanks for sharing the LIVE! 🔥","↗️");
 activityAdd(user,"Thanks for sharing! ❤️");
 makeParticles(false);
}

/* ===== GIFT LEVEL ===== */

function giftLevel(count){
 if(count>=1000) return "legendary";
 if(count>=500) return "epic";
 if(count>=100) return "rare";
 return "normal";
}

/* ===== GIFT ===== */

function showGift(user,giftName="Gift",count=1){
 const level=giftLevel(Number(count));

 if(level==="legendary"){
   showAlert(
     user,
     `LEGENDARY GIFT — ${giftName}! 🔥`,
     "💎",
     count
   );

   fullBlast(true);
   setTimeout(()=>{
     showAlert(user,"THANKS FOR THE LOVE! ❤️🔥","🎁",count);
   },900);

 }else if(level==="epic"){
   showAlert(
     user,
     `EPIC GIFT — ${giftName}! ✨`,
     "💎",
     count
   );

   fullBlast(true);

 }else if(level==="rare"){
   showAlert(
     user,
     `Amazing gift — ${giftName}! 💖`,
     "🎁",
     count
   );

   fullBlast(false);

 }else{
   showAlert(
     user,
     `Sent ${giftName}! Thanks for the love ❤️`,
     "🎁",
     count
   );

   makeParticles(false);
 }

 activityAdd(
   user,
   `🎁 ${giftName} ×${count} — Thanks for the love ❤️`
 );
}

/* ===== MYSTERY WELCOME ===== */

function showMysteryWelcome(user){
 const name=mystery.querySelector(".mystery-user");
 name.textContent="@"+user.name;

 mystery.style.display="flex";
 makeParticles(true);

 setTimeout(()=>{
   mystery.style.display="none";
 },4200);
}

/* =================================================
   DEMO TEST BUTTONS ARE NOT DISPLAYED.
   Uncomment any line below temporarily for testing.
   ================================================= */

// showWelcome({name:"NewViewer",avatar:DEFAULT_AVATAR});
// setTimeout(()=>showFollow({name:"LuckyFan",avatar:"https://i.pravatar.cc/150?img=32"}),3000);
// setTimeout(()=>showLike({name:"TapTapFan",avatar:"https://i.pravatar.cc/150?img=44"},25),5000);
// setTimeout(()=>showGift({name:"VIP_Gifter",avatar:"https://i.pravatar.cc/150?img=55"},"Rose",100),7000);
// setTimeout(()=>showGift({name:"LegendFan",avatar:"https://i.pravatar.cc/150?img=60"},"Diamond",1000),10000);
// setTimeout(()=>showMysteryWelcome({name:"MysteryFan",avatar:DEFAULT_AVATAR}),14000);

/*
  Server event mapping will be connected next.

  welcome -> showWelcome(user)
  follow  -> showFollow(user)
  like    -> showLike(user,amount)
  gift    -> showGift(user,giftName,count)
  comment -> showComment(user,comment)
  share   -> showShare(user)
*/
</script>

</body>
</html>
